name: contribfinder

# The Postgres credentials, once (ROOT-9). DATABASE_URL below repeats them: keep it in step.
x-postgres-env: &postgres-env
  POSTGRES_DB: contribfinder
  POSTGRES_USER: contribfinder
  POSTGRES_PASSWORD: contribfinder

x-backend: &backend
  build:
    context: ./apps/backend
    args:
      UV_SYNC_ARGS: "--frozen"
  env_file: .env
  # DJANGO_SETTINGS_MODULE comes from .env only, never from the shell running compose (ROOT-8).
  environment:
    # Container hostnames; override the localhost defaults used by `npm start`.
    DATABASE_URL: postgres://contribfinder:contribfinder@postgres:5432/contribfinder
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./apps/backend:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    # pgvector-enabled image so embeddings (Phase 6) need no image change.
    image: pgvector/pgvector:pg16
    environment: *postgres-env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Not published: containers reach it as redis:6379, and host port 6379 stays free for the
    # WSL Redis that `npm start` uses (ROOT-3).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    # Loopback only: the DEBUG dev server is not reachable from the network (ROOT-1, ROOT-2).
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info

  beat:
    <<: *backend
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule

  frontend:
    build: ./apps/frontend
    # Only what Vite needs; the backend's secrets stay out of this container.
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      # Bind mounts from a Windows host send no file events: poll (ROOT-5).
      VITE_WATCH_POLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./apps/frontend:/app
      # Anonymous volume: it keeps the old dependencies across `up --build`. After a dependency
      # change run `docker compose up --build --renew-anon-volumes` (ROOT-4).
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres-data:
