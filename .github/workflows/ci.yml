name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer run cancels an older one only on pull requests. Pushes group by commit: a group holds
# one pending run and a newer one replaces it even without cancel-in-progress, so a shared group
# on main would skip queued commits.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every uv command uses the committed lock as is, also `uv run` inside npm scripts: a dependency
# change without `uv lock` fails instead of resolving on the fly (CI-1).
env:
  UV_LOCKED: "1"

# Actions are pinned to commits (the version they stand for in the comment; Dependabot proposes
# updates). No checkout keeps the job token in .git/config: nothing pushes (CI-5, CI-6).
jobs:
  backend:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: contribfinder
          POSTGRES_USER: contribfinder
          POSTGRES_PASSWORD: contribfinder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contribfinder"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://contribfinder:contribfinder@localhost:5432/contribfinder
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run --settings config.settings.test
      - name: Tests
        run: uv run pytest

  frontend:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      # Before the tests: the build type-checks (tsc -b), and csp.config.test.ts checks the built
      # index.html only when dist/ exists (CI-2, CI-10).
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test

  api-contract:
    # Fails when the committed OpenAPI schema / generated TS types drift from the backend.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/frontend/package-lock.json
            apps/frontend/tools/api-types/package-lock.json
      - name: Version consistency
        run: node scripts/check-version.mjs
      - run: npm ci
      - name: Script tests
        run: npm run test:scripts
      - name: Script lint
        run: npm run lint:scripts
      - name: Script format
        run: npm run format:scripts
      - run: uv sync --locked
        working-directory: apps/backend
      - run: npm ci
        working-directory: apps/frontend
      # The type generator's own locked tree (it needs TypeScript 5; CI-4).
      - run: npm ci
        working-directory: apps/frontend/tools/api-types
      - name: Regenerate schema and types
        run: npm run api:sync
        working-directory: apps/frontend
      # Untracked files count too: a newly generated file is drift (CI-3).
      - name: Check for drift
        run: |
          drift="$(git status --porcelain -- apps/frontend/src/api)"
          if [ -n "$drift" ]; then
            echo "$drift"
            git diff -- apps/frontend/src/api
            echo "::error::OpenAPI schema or generated types are stale. Run 'npm run api:sync' in apps/frontend and commit the result."
            exit 1
          fi

  scripts-windows:
    # The runners' main target is Windows (taskkill, %APPDATA% uv lookup, detached wsl.exe):
    # their tests run there too. Lint and format stay on Linux (CI-8). The tests import only
    # Node built-ins and ./*.mjs, so no `npm ci`.
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Script tests
        run: npm run test:scripts

  e2e:
    # Browser tests (Playwright, Chromium) against the real Django backend and PostgreSQL.
    # The seed creates the contribfinder_e2e database; nothing calls GitHub.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: contribfinder
          POSTGRES_USER: contribfinder
          POSTGRES_PASSWORD: contribfinder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contribfinder"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://contribfinder:contribfinder@localhost:5432/contribfinder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: uv sync --locked
        working-directory: apps/backend
      - run: npm ci
        working-directory: apps/frontend
      # The browser download is cached by the installed Playwright (it pins its browser builds;
      # its package.json changes only with its version), not by the whole lockfile (CI-9); the
      # system libraries are not cached, so a hit still installs those.
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/frontend/node_modules/@playwright/test/package.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/frontend
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: apps/frontend
      # Its own limit, under the job's: a hang fails this step and the report below is still
      # uploaded (a timed-out job is cancelled before any later step runs) (CI-7).
      - name: Browser tests
        timeout-minutes: 20
        run: npm run e2e
        working-directory: apps/frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() || cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
