name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer run cancels an older one only on pull requests. Pushes group by commit: a group holds
# one pending run and a newer one replaces it even without cancel-in-progress, so a shared group
# on main would skip queued commits.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: contribfinder
          POSTGRES_USER: contribfinder
          POSTGRES_PASSWORD: contribfinder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contribfinder"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://contribfinder:contribfinder@localhost:5432/contribfinder
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run --settings config.settings.test
      - name: Tests
        run: uv run pytest

  frontend:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  api-contract:
    # Fails when the committed OpenAPI schema / generated TS types drift from the backend.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/frontend/package-lock.json
      - name: Version consistency
        run: node scripts/check-version.mjs
      - run: npm ci
      - name: Script tests
        run: npm run test:scripts
      - name: Script lint
        run: npm run lint:scripts
      - name: Script format
        run: npm run format:scripts
      - run: uv sync --frozen
        working-directory: apps/backend
      - run: npm ci
        working-directory: apps/frontend
      - name: Regenerate schema and types
        run: npm run api:sync
        working-directory: apps/frontend
      - name: Check for drift
        run: |
          if ! git diff --exit-code -- apps/frontend/src/api; then
            echo "::error::OpenAPI schema or generated types are stale. Run 'npm run api:sync' in apps/frontend and commit the result."
            exit 1
          fi

  e2e:
    # Browser tests (Playwright, Chromium) against the real Django backend and PostgreSQL.
    # The seed creates the contribfinder_e2e database; nothing calls GitHub.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: contribfinder
          POSTGRES_USER: contribfinder
          POSTGRES_PASSWORD: contribfinder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contribfinder"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://contribfinder:contribfinder@localhost:5432/contribfinder
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: apps/backend
      - run: npm ci
        working-directory: apps/frontend
      # The browser download is cached by lockfile (Playwright pins its browser builds); the
      # system libraries are not, so a cache hit still installs those.
      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/frontend
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: apps/frontend
      - name: Browser tests
        run: npm run e2e
        working-directory: apps/frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7
