name: Dependency audit

# Known vulnerabilities in the locked dependencies (`npm run audit:deps`, scripts/audit.mjs).
# Weekly as well: an advisory published after the last commit still turns this red.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# As in ci.yml: cancel only on pull requests. The event is part of the key, so a scheduled run
# never replaces the push run of the same commit.
concurrency:
  group: audit-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dependency-audit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      # Pinned to commits, no stored token (as in ci.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # No installs: uv export --frozen and npm audit read only the lockfiles.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Audit locked dependencies
        run: npm run audit:deps
