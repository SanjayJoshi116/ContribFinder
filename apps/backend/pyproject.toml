[project]
name = "contribfinder-backend"
version = "0.12.31"
description = "ContribFinder API, workers and matching services"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.16",
    "django-environ>=0.12",
    "django-filter>=25.1",
    "django-cors-headers>=4.7",
    "drf-spectacular>=0.28",
    "celery>=5.5",
    "redis>=5.2",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "cryptography>=45",
    "gunicorn>=23",
    "django-stubs-ext>=6.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.11",
    "factory-boy>=3.3",
    "respx>=0.22",
    "ruff>=0.12",
    "mypy>=1.16",
    "django-stubs[compatible-mypy]>=5.2",
    "djangorestframework-stubs[compatible-mypy]>=3.16",
    "celery-types>=0.23",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# F811: fixtures shared by import are test parameters of the same name.
"tests/**" = ["S101", "S105", "S106", "F811"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
ignore_missing_imports = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.django-stubs]
django_settings_module = "config.settings.test"
